spring.application.name=fintrack-test

# Dedicated integration-test database
spring.datasource.url=jdbc:mysql://localhost:3306/fintrack_test?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Test-only schema management
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT configuration
app.jwt.secret=VGhpc0lzQVRlc3RTZWNyZXRLZXlGb3JGaW50cmFja0FwcDIwMjY=
app.jwt.expiration-ms=900000

# Cleaner test output
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
